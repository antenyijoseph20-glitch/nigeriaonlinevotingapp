<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Profile | Nigeria Online Voting System</title>

    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

<header>
    <div class="container">

        <h1>🇳🇬 Nigeria Online Voting System</h1>

        <nav>
            <a href="/">Home</a>
            <a href="/dashboard">Dashboard</a>
            <a href="/logout">Logout</a>
        </nav>

    </div>
</header>

<main class="form-container">

    <h2>Complete Your Voter Profile</h2>

    <p>
        Please complete your profile before your voter account can be verified.
    </p>

    <form action="/profile" method="POST">

        <label>First Name</label>
        <input
            type="text"
            name="firstName"
            value="{{.FirstName}}"
            readonly>

        <label>Last Name</label>
        <input
            type="text"
            name="lastName"
            value="{{.LastName}}"
            readonly>

        <label>Email</label>
        <input
            type="email"
            name="email"
            value="{{.Email}}"
            readonly>

        <label>Phone Number</label>
        <input
            type="text"
            name="phoneNumber"
            value="{{.PhoneNumber}}"
            readonly>

        <label>NIN</label>
        <input
            type="text"
            name="nin"
            value="{{.NIN}}"
            readonly>

        <label>Other Name</label>
        <input
            type="text"
            name="otherName"
            value="{{.OtherName}}">

        <label>Gender</label>

        <select name="gender">
            <option value="">Select Gender</option>
            <option value="Male" {{if eq .Gender "Male"}}selected{{end}}>Male</option>
            <option value="Female" {{if eq .Gender "Female"}}selected{{end}}>Female</option>
        </select>

        <label>VIN (Voter Identification Number)</label>
        <input
            type="text"
            name="vin"
            value="{{.VIN}}">

        <label>State</label>
        <input
            type="text"
            name="state"
            value="{{.State}}">

        <label>Local Government Area (LGA)</label>
        <input
            type="text"
            name="lga"
            value="{{.LGA}}">

        <label>Ward</label>
        <input
            type="text"
            name="ward"
            value="{{.Ward}}">

        <label>Polling Unit</label>
        <input
            type="text"
            name="pollingUnit"
            value="{{.PollingUnit}}">

        <br><br>

        <button type="submit">
            Save Profile
        </button>

    </form>

</main>

</body>
</html>
