<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Nigeria Online Voting System</title>

    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <header>
        <div class="container">

            <h1>🇳🇬 Nigeria Online Voting System</h1>

            <nav>
                <a href="/">Home</a>
                <a href="/login">Login</a>
                <a href="/register">Register</a>
            </nav>

        </div>
    </header>

    <main class="form-container">

        <h2>Login to Your Account</h2>

        <p class="form-description">
            Enter your email address and password to access your voting account.
        </p>

        <form action="/login" method="POST">

            <div class="form-group">
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit">Login</button>

        </form>

        <div class="form-footer">
            <p>
                Don't have an account?
                <a href="/register">Create one here</a>
            </p>
        </div>

    </main>

    <footer>
        <p>&copy; 2026 Nigeria Online Voting System. All rights reserved.</p>
    </footer>

</body>
</html>
