<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voter Verification | Nigeria Online Voting System</title>

    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

<header>

    <div class="container">

        <h1>🇳🇬 Nigeria Online Voting System</h1>

        <nav>
            <a href="/dashboard">Dashboard</a>
            <a href="/profile">Profile</a>
            <a href="/verification">Verification</a>
            <a href="/logout">Logout</a>
        </nav>

    </div>

</header>

<main class="form-container">

    <h2>Voter Verification</h2>

    <p>
        Complete the form below. Your information will be reviewed before your
        account is approved for voting.
    </p>

    <form action="/verification" method="POST">

        <label>Full Name</label>
        <input
            type="text"
            name="fullName"
            placeholder="Enter your full name"
            required>

        <label>Date of Birth</label>
        <input
            type="date"
            name="dateOfBirth"
            required>

        <label>Gender</label>

        <select name="gender" required>
            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
        </select>

        <label>State</label>
        <input
            type="text"
            name="state"
            placeholder="Enter your state"
            required>

        <label>Local Government Area (LGA)</label>
        <input
            type="text"
            name="lga"
            placeholder="Enter your LGA"
            required>

        <label>Ward</label>
        <input
            type="text"
            name="ward"
            placeholder="Enter your ward"
            required>

        <label>Polling Unit</label>
        <input
            type="text"
            name="pollingUnit"
            placeholder="Enter your polling unit"
            required>

        <label>Email Address</label>
        <input
            type="email"
            value="{{.Email}}"
            readonly>

        <label>National Identification Number (NIN)</label>
        <input
            type="text"
            value="{{.NIN}}"
            readonly>

        <button type="submit">
            Submit Verification
        </button>

        <a class="btn" href="/dashboard">
            Cancel
        </a>

    </form>

</main>

</body>

</html>
